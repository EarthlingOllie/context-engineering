name: Checks

on:
  push:
    branches:
      - master
      - '*.x'
  pull_request:

permissions:
  contents: read

# Runs bin/check, the same gate developers run before sharing work:
# code style, the Pest suite at 100% coverage, the front-end build and the
# Playwright browser journeys. A change that drops coverage or breaks a
# journey fails here too.
jobs:
  check:
    runs-on: ubuntu-latest
    name: bin/check

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, fileinfo
          coverage: pcov

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install npm dependencies
        run: npm ci

      - name: Install the browser for the journeys
        run: npx playwright install --with-deps chromium

      - name: Run the gate
        run: bin/check

      - name: Keep traces of failed journeys
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results
          retention-days: 7
